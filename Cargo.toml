[package]
name = "raptorq-pep"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A resilient multi-flow TCP tunnel over UDP with RaptorQ FEC and authenticated encryption"
license = "MIT"
repository = "https://github.com/virtuallynathan/raptorq-pep-v2"
readme = "README.md"
keywords = ["fec", "raptorq", "tunnel", "streaming", "udp"]
categories = ["network-programming"]

[[bin]]
name = "raptorq-pep"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.1", features = ["derive"] }
hkdf = "0.13.0"
hmac = "0.13.0"
rand = "0.10.2"
raptorq = "2.0.1"
sha2 = "0.11.0"
socket2 = "0.6.4"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "raptorq"
harness = false
